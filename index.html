<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Factory Station Maintenance</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, onSnapshot, addDoc, deleteDoc, writeBatch, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "", 
                authDomain: "manutencao-fabrica.firebaseapp.com",
                projectId: "manutencao-fabrica",
                storageBucket: "manutencao-fabrica.firebasestorage.app",
                messagingSenderId: "322227932590",
                appId: "1:322227932590:web:2459b650fb9ca7c3b14c3f"
            };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'factory-maintenance-v1';
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.FB = { 
            auth, db, appId, initialToken, 
            methods: { 
                doc, setDoc, getDoc, collection, query, onSnapshot, addDoc, deleteDoc, 
                writeBatch, serverTimestamp, signInWithCustomToken, signInAnonymously, 
                onAuthStateChanged, updateDoc 
            } 
        };
    </script>

    <style>
        @keyframes heartbeat { 
            0% { transform: scale(1); opacity: 0.6; } 
            14% { transform: scale(1.15); opacity: 1; } 
            28% { transform: scale(1); opacity: 0.6; } 
            42% { transform: scale(1.15); opacity: 1; } 
            56% { transform: scale(1); opacity: 0.6; }
            85% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1); opacity: 0.6; }
        }
        
        @keyframes heart-glow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(81, 184, 234, 0.6)) drop-shadow(0 0 20px rgba(81, 184, 234, 0.3)); }
            14%, 42% { filter: drop-shadow(0 0 20px rgba(81, 184, 234, 0.9)) drop-shadow(0 0 35px rgba(81, 184, 234, 0.5)); }
            28%, 56% { filter: drop-shadow(0 0 10px rgba(81, 184, 234, 0.6)) drop-shadow(0 0 20px rgba(81, 184, 234, 0.3)); }
        }
        
        .animate-heartbeat { 
            animation: heartbeat 2.5s ease-in-out infinite, heart-glow 2.5s ease-in-out infinite;
        }

        @keyframes pulse-success {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .animate-success-pulse { animation: pulse-success 1.5s ease-out forwards; }

        .label-gradient {
            background: linear-gradient(90deg, rgb(81, 184, 234) 0%, rgb(27, 71, 148) 100%);
        }

        .button-group-border {
            background: linear-gradient(#000, #000) padding-box, 
                        linear-gradient(90deg, rgb(81, 184, 234) 0%, rgb(27, 71, 148) 100%) border-box;
            border: 2px solid transparent;
            border-radius: 9999px;
        }

        body {
            margin: 0; 
            padding: 0;
            background-color: #ffffff;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        .map-container {
            position: relative;
            width: 100%;
            height: auto;
            max-width: 100%;
            aspect-ratio: 16 / 9;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body, #root {
                overflow-y: auto !important;
                height: auto !important;
                min-height: 100vh;
            }
            .app-wrapper {
                height: auto !important;
                min-height: 100vh;
                overflow-y: visible !important;
            }
            .map-container {
                aspect-ratio: auto;
                height: 80vh;
                min-height: 400px;
            }
        }

        @media (max-width: 768px) and (orientation: portrait) {
            .map-container {
                aspect-ratio: auto;
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const ASSETS = {
            LAYOUT: "https://static.wixstatic.com/media/a6967f_aac24f82eec442c8992856c104e39d20~mv2.png",
            SPLASH: "https://static.wixstatic.com/media/a6967f_1a75ce18a54d46f8994283c1798fbbfb~mv2.png",
            LOGO: "https://static.wixstatic.com/media/a6967f_eee0d017524f4a48bf2870cc2385c10b~mv2.png",
            ICON: "https://static.wixstatic.com/media/a6967f_874354ad69c5461eafd229ab23540233~mv2.png",
            LOADING_GIF: "https://static.wixstatic.com/media/a6967f_9142290f38c8426c98c49711bd0b7974~mv2.gif"
        };

        const STATUS_VALUES = { sad: 0, neutral: 1, happy: 3 };

        const Icons = {
            Heart: ({ size = 24, fill = "currentColor" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill={fill}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            ),
            Map: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>,
            Stats: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>,
            Settings: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            Trash: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Check: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Send: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
            X: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        };

        const SmileyFace = ({ type, className = "" }) => {
            const BaseFace = ({ children }) => (
                <svg viewBox="0 0 100 100" className={className} fill="none">
                    <circle cx="50" cy="50" r="45" stroke="currentColor" strokeWidth="8"/>
                    <circle cx="33" cy="40" r="6" fill="currentColor"/><circle cx="67" cy="40" r="6" fill="currentColor"/>
                    {children}
                </svg>
            );
            if (type === 'happy') return <BaseFace><path d="M30 65C35 72 42 75 50 75C58 75 65 72 70 65" stroke="currentColor" strokeWidth="8" strokeLinecap="round"/></BaseFace>;
            if (type === 'neutral') return <BaseFace><path d="M30 65H70" stroke="currentColor" strokeWidth="8" strokeLinecap="round"/></BaseFace>;
            if (type === 'sad') return <BaseFace><path d="M30 75C35 68 42 65 50 65C58 65 65 68 70 75" stroke="currentColor" strokeWidth="8" strokeLinecap="round"/></BaseFace>;
            return null;
        };

        function App() {
            const [view, setView] = useState('splash');
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [adminMode, setAdminMode] = useState('dashboard'); 
            const [points, setPoints] = useState([]);
            const [historyLogs, setHistoryLogs] = useState([]);
            const [pendingEvaluations, setPendingEvaluations] = useState({});
            const [activeEval, setActiveEval] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [showSuccessPulse, setShowSuccessPulse] = useState(false);
            const [showLoadingOverlay, setShowLoadingOverlay] = useState(false);
            
            const [loginModal, setLoginModal] = useState({ open: false, user: '', pass: '' });
            const [pointModal, setPointModal] = useState(null); 
            
            const mapContainerRef = useRef(null);

            useEffect(() => {
                if (!window.FB) return;
                const { auth, initialToken, methods } = window.FB;
                const initAuth = async () => {
                    try {
                        if (initialToken) await methods.signInWithCustomToken(auth, initialToken);
                        else await methods.signInAnonymously(auth);
                    } catch (e) { console.error("Erro na autenticação:", e); }
                };
                initAuth();
                const unsubscribe = methods.onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !window.FB) return;
                const { db, appId, methods } = window.FB;
                const pointsRef = methods.collection(db, 'artifacts', appId, 'public', 'data', 'config_points');
                const logsRef = methods.collection(db, 'artifacts', appId, 'public', 'data', 'history_logs');
                const unsubPoints = methods.onSnapshot(pointsRef, (snap) => {
                    setPoints(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubLogs = methods.onSnapshot(logsRef, (snap) => {
                    setHistoryLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => { unsubPoints(); unsubLogs(); };
            }, [user]);

            useEffect(() => {
                if (view !== 'app') return;
                let timer;
                const reset = () => {
                    clearTimeout(timer);
                    timer = setTimeout(() => { setView('splash'); setPendingEvaluations({}); }, 30000);
                };
                const events = ['mousedown', 'keydown', 'touchstart'];
                events.forEach(e => window.addEventListener(e, reset));
                reset();
                return () => { clearTimeout(timer); events.forEach(e => window.removeEventListener(e, reset)); };
            }, [view]);

            const stats = useMemo(() => {
                const s = {}; 
                points.forEach(p => s[p.id] = { name: p.name, score: 0, count: 0 });
                historyLogs.forEach(log => {
                    if (s[log.pointId]) { s[log.pointId].score += log.score; s[log.pointId].count++; }
                });
                const list = Object.values(s).filter(x => x.count > 0).map(st => ({
                    ...st,
                    performance: (st.score / (st.count * 3)) * 100
                }));
                const totalScore = list.reduce((a, b) => a + b.score, 0);
                const totalPotential = list.reduce((a, b) => a + (b.count * 3), 0);
                return {
                    list: list.sort((a,b) => b.performance - a.performance),
                    avg: totalPotential > 0 ? ((totalScore / totalPotential) * 100).toFixed(1) : "0",
                    total: historyLogs.length
                };
            }, [points, historyLogs]);

            const getHealthColor = (val) => {
                if (val < 50) return { bg: 'bg-red-600', text: 'text-red-600', bar: 'bg-red-500' };
                if (val < 75) return { bg: 'bg-amber-500', text: 'text-amber-600', bar: 'bg-amber-500' };
                return { bg: 'bg-emerald-600', text: 'text-emerald-600', bar: 'bg-emerald-600' };
            };

            const handleStart = () => {
                setShowLoadingOverlay(true);
                setTimeout(() => {
                    setShowLoadingOverlay(false);
                    setView('app');
                }, 4000);
            };

            const submitEvaluations = async () => {
                if (isSubmitting || !window.FB) return;
                setIsSubmitting(true);
                const { db, appId, methods } = window.FB;
                const batch = methods.writeBatch(db);
                const logsRef = methods.collection(db, 'artifacts', appId, 'public', 'data', 'history_logs');
                try {
                    Object.entries(pendingEvaluations).forEach(([id, status]) => {
                        const newLog = methods.doc(logsRef);
                        batch.set(newLog, { pointId: id, status, score: STATUS_VALUES[status], timestamp: methods.serverTimestamp() });
                    });
                    await batch.commit();
                    setPendingEvaluations({});
                    setShowSuccessPulse(true);
                    setTimeout(() => setShowSuccessPulse(false), 2000);
                } catch (e) { console.error("Erro no envio:", e); } finally { setIsSubmitting(false); }
            };

            const togglePoint = async (data) => {
                if (!window.FB) return;
                const { db, appId, methods } = window.FB;
                const ref = methods.collection(db, 'artifacts', appId, 'public', 'data', 'config_points');
                try {
                    if (data.id) await methods.updateDoc(methods.doc(db, 'artifacts', appId, 'public', 'data', 'config_points', data.id), { name: data.name });
                    else await methods.addDoc(ref, { name: data.name, x: data.x, y: data.y });
                    setPointModal(null);
                } catch (e) { console.error(e); }
            };

            const removePoint = async (id) => {
                if (!window.FB) return;
                const { db, appId, methods } = window.FB;
                try {
                    await methods.deleteDoc(methods.doc(db, 'artifacts', appId, 'public', 'data', 'config_points', id));
                    setPointModal(null);
                } catch (e) { console.error(e); }
            };

            if (view === 'splash') {
                return (
                    <div className="relative h-screen w-full bg-white flex flex-col items-center justify-center cursor-pointer overflow-hidden" onClick={handleStart}>
                        {showLoadingOverlay && (
                            <div className="fixed inset-0 z-50 bg-white flex items-center justify-center">
                                <img src={ASSETS.LOADING_GIF} className="w-64 h-64 object-contain" alt="A carregar..." />
                            </div>
                        )}
                        <img src={ASSETS.LOGO} className="absolute top-10 left-10 w-48 hidden md:block" alt="Logo" />
                        <div className="relative z-10 scale-90 md:scale-100 flex flex-col items-center">
                            <div className="relative">
                                {/* TEXTO POSICIONADO 20% ACIMA DO HEARTBEAT (CENTRO) */}
                                <p className="absolute left-1/2 -translate-x-1/2 top-[20%] font-black text-slate-400 tracking-[0.3em] uppercase animate-pulse whitespace-nowrap z-30">
                                    Touch to Begin
                                </p>
                                <img src={ASSETS.SPLASH} className="max-w-md md:max-w-xl rounded-[3rem] shadow-2xl" alt="Splash" />
                                <div className="absolute inset-0 flex items-center justify-center pointer-events-none animate-heartbeat">
                                    <Icons.Heart size={100} fill="url(#grad1)" />
                                    <svg width="0" height="0"><defs><linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style={{stopColor:'rgb(81, 184, 234)',stopOpacity:1}} /><stop offset="100%" style={{stopColor:'rgb(27, 71, 148)',stopOpacity:1}} /></linearGradient></defs></svg>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-wrapper min-h-screen bg-slate-50 flex flex-col text-slate-900 md:h-screen md:overflow-hidden">
                    <header className="bg-white px-6 py-4 flex items-center justify-between border-b border-slate-200 shadow-sm z-30 shrink-0">
                        <div className="flex items-center gap-4">
                            <img src={ASSETS.ICON} className="w-10 h-10 md:w-12 md:h-12" alt="Icon" />
                            <div>
                                <h1 className="font-black text-lg md:text-xl tracking-tighter uppercase">{isAdmin ? 'Operations Dashboard' : 'Factory Pulse'}</h1>
                                <p className="text-[10px] text-slate-400 font-bold tracking-widest uppercase">Maintenance Audit</p>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            {isAdmin && (
                                <button onClick={() => setAdminMode(m => m === 'dashboard' ? 'edit' : 'dashboard')} className="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-[10px] md:text-xs font-bold uppercase flex items-center gap-2 transition-all">
                                    <Icons.Settings /> {adminMode === 'dashboard' ? 'Edit Map' : 'Analytics'}
                                </button>
                            )}
                            <button onClick={() => isAdmin ? setIsAdmin(false) : setLoginModal(m => ({...m, open: true}))} className={`px-4 md:px-6 py-2 rounded-xl text-[10px] md:text-xs font-black uppercase transition-all ${isAdmin ? 'bg-amber-100 text-amber-600' : 'border-2 border-slate-200 hover:border-indigo-600'}`}>
                                {isAdmin ? 'Logout' : 'Admin'}
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 relative overflow-y-auto overflow-x-hidden md:overflow-hidden">
                        <div className="max-w-7xl mx-auto p-4 md:p-6 h-full flex flex-col">
                            {isAdmin && adminMode === 'dashboard' ? (
                                <div className="animate-in fade-in slide-in-from-bottom-4 duration-500 w-full">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 md:mb-8">
                                        <div className={`${getHealthColor(parseFloat(stats.avg)).bg} p-6 md:p-8 rounded-[2rem] md:rounded-[2.5rem] text-white shadow-xl`}>
                                            <p className="text-[10px] font-black uppercase opacity-70 tracking-widest mb-1">Global Health Index</p>
                                            <h2 className="text-4xl md:text-6xl font-black">{stats.avg}%</h2>
                                        </div>
                                        <div className="bg-white border border-slate-200 p-6 md:p-8 rounded-[2rem] md:rounded-[2.5rem] flex items-center gap-4 md:gap-6 shadow-sm">
                                            <div className="p-3 md:p-4 bg-slate-100 rounded-2xl text-indigo-600"><Icons.Stats /></div>
                                            <div><p className="text-[10px] font-black text-slate-400 uppercase">Inspections</p><h3 className="text-2xl md:text-3xl font-black">{stats.total}</h3></div>
                                        </div>
                                        <div className="bg-white border border-slate-200 p-6 md:p-8 rounded-[2rem] md:rounded-[2.5rem] flex items-center gap-4 md:gap-6 shadow-sm">
                                            <div className="p-3 md:p-4 bg-slate-100 rounded-2xl text-indigo-600"><Icons.Check /></div>
                                            <div><p className="text-[10px] font-black text-slate-400 uppercase">Active Points</p><h3 className="text-2xl md:text-3xl font-black">{points.length}</h3></div>
                                        </div>
                                    </div>
                                    <div className="bg-white border border-slate-200 rounded-[2rem] md:rounded-[3rem] p-6 md:p-8 shadow-sm">
                                        <h3 className="text-lg md:text-xl font-black uppercase mb-6">Station Performance Breakdown</h3>
                                        <div className="space-y-4">
                                            {stats.list.map(s => (
                                                <div key={s.name} className="group">
                                                    <div className="flex justify-between items-center mb-2">
                                                        <span className="font-bold uppercase text-xs md:text-sm">{s.name}</span>
                                                        <span className={`font-black text-sm ${getHealthColor(s.performance).text}`}>{s.performance.toFixed(1)}%</span>
                                                    </div>
                                                    <div className="h-2.5 md:h-3 bg-slate-100 rounded-full overflow-hidden">
                                                        <div className={`h-full transition-all duration-1000 ${getHealthColor(s.performance).bar}`} style={{width: `${s.performance}%`}} />
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="h-full flex flex-col gap-4 min-h-[400px]">
                                    {isAdmin && adminMode === 'edit' && (
                                        <div className="bg-amber-50 text-amber-700 px-4 py-2 rounded-xl text-[10px] font-bold animate-pulse flex items-center gap-2 shrink-0">
                                            <Icons.Settings /> Edit Mode: Click on map to add/edit stations.
                                        </div>
                                    )}
                                    <div 
                                        className={`relative flex-1 bg-white rounded-[1.5rem] md:rounded-[2rem] border-[8px] md:border-[12px] border-white shadow-2xl overflow-hidden ${isAdmin && adminMode === 'edit' ? 'cursor-crosshair' : ''}`}
                                        ref={mapContainerRef}
                                        onClick={(e) => {
                                            if (!isAdmin || adminMode !== 'edit') return;
                                            const rect = mapContainerRef.current.getBoundingClientRect();
                                            const x = ((e.clientX - rect.left) / rect.width) * 100;
                                            const y = ((e.clientY - rect.top) / rect.height) * 100;
                                            setPointModal({ x, y, name: '' });
                                        }}
                                    >
                                        <img src={ASSETS.LAYOUT} className="w-full h-full object-contain pointer-events-none" alt="Map Layout" />
                                        {points.map(pt => {
                                            const pending = pendingEvaluations[pt.id];
                                            const isEvaluated = !!pending;
                                            return (
                                                <div key={pt.id} className="absolute -translate-x-1/2 -translate-y-1/2 z-20" style={{top: `${pt.y}%`, left: `${pt.x}%`}}>
                                                    <button onClick={(e) => { e.stopPropagation(); if (isAdmin && adminMode === 'edit') setPointModal(pt); else setActiveEval(pt); }} className={`group flex flex-col items-center gap-1 transition-all ${isEvaluated ? 'scale-110' : 'hover:scale-105 active:scale-95'}`}>
                                                        <div className={`button-group-border p-1 flex gap-1 shadow-lg transition-all ${isEvaluated ? 'ring-2 md:ring-4 ring-indigo-400 ring-offset-1 md:ring-offset-2' : 'opacity-80 group-hover:opacity-100'}`}>
                                                            <SmileyFace type="sad" className={`w-5 h-5 md:w-8 md:h-8 transition-all ${pending === 'sad' ? 'text-red-500' : 'text-slate-200'}`} />
                                                            <SmileyFace type="neutral" className={`w-5 h-5 md:w-8 md:h-8 transition-all ${pending === 'neutral' ? 'text-amber-500' : 'text-slate-200'}`} />
                                                            <SmileyFace type="happy" className={`w-5 h-5 md:w-8 md:h-8 transition-all ${pending === 'happy' ? 'text-emerald-500' : 'text-slate-200'}`} />
                                                        </div>
                                                        <span className="label-gradient text-[7px] md:text-[10px] text-white font-black px-1.5 md:px-2 py-0.5 md:py-1 rounded shadow-md uppercase truncate max-w-[60px] md:max-w-[80px]">{pt.name}</span>
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {!isAdmin && Object.keys(pendingEvaluations).length > 0 && (
                        <div className="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-40 animate-in slide-in-from-bottom-10">
                            <button onClick={submitEvaluations} disabled={isSubmitting} className="w-20 h-20 md:w-32 md:h-32 bg-indigo-600 rounded-full text-white shadow-2xl flex flex-col items-center justify-center border-4 border-white hover:scale-110 active:scale-95 transition-all">
                                {isSubmitting ? <div className="w-6 h-6 md:w-8 md:h-8 border-4 border-white border-t-transparent rounded-full animate-spin" /> : <Icons.Send />}
                                <span className="text-[8px] md:text-[10px] font-black uppercase mt-1">Submit</span>
                                <div className="absolute -top-1 -right-1 md:-top-2 md:-right-2 w-8 h-8 md:w-10 md:h-10 bg-red-500 rounded-full flex items-center justify-center font-black border-2 md:border-4 border-white text-xs">{Object.keys(pendingEvaluations).length}</div>
                            </button>
                        </div>
                    )}

                    {showSuccessPulse && (
                        <div className="fixed inset-0 z-[100] bg-white/50 backdrop-blur-sm flex items-center justify-center pointer-events-none">
                            <div className="animate-success-pulse text-indigo-600"><Icons.Heart size={200} fill="currentColor" /></div>
                        </div>
                    )}

                    {activeEval && (
                        <div className="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-4xl rounded-[2.5rem] md:rounded-[3rem] p-8 md:p-16 flex flex-col items-center animate-in zoom-in-95 max-h-[90vh] overflow-y-auto">
                                <h3 className="text-3xl md:text-6xl font-black uppercase text-center mb-2 md:mb-4 tracking-tighter">{activeEval.name}</h3>
                                <p className="text-slate-400 font-bold uppercase mb-8 md:mb-12 text-xs md:text-base">Station Condition Assessment</p>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 w-full mb-8 md:mb-10">
                                    {[{ id: 'sad', label: 'Critical', color: 'red' }, { id: 'neutral', label: 'Acceptable', color: 'amber' }, { id: 'happy', label: 'Excellent', color: 'emerald' }].map(opt => (
                                        <button key={opt.id} onClick={() => { setPendingEvaluations(p => ({...p, [activeEval.id]: opt.id})); setActiveEval(null); }} className={`flex flex-row md:flex-col items-center justify-center gap-4 md:gap-6 p-6 md:p-10 rounded-[2rem] bg-slate-50 border-4 border-transparent hover:border-${opt.color}-500 transition-all active:scale-95 group shadow-sm`}>
                                            <SmileyFace type={opt.id} className={`w-12 h-12 md:w-40 md:h-40 text-${opt.color}-500`} />
                                            <span className={`font-black text-lg md:text-2xl uppercase text-${opt.color}-600`}>{opt.label}</span>
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => setActiveEval(null)} className="px-10 py-3 md:px-12 md:py-4 bg-slate-100 rounded-2xl font-black uppercase text-slate-400 text-xs md:text-base">Cancel</button>
                            </div>
                        </div>
                    )}

                    {loginModal.open && (
                        <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4">
                            <form onSubmit={(e) => { e.preventDefault(); if (loginModal.user.toUpperCase() === 'GESTÃO' && loginModal.pass === '789') { setIsAdmin(true); setLoginModal(m => ({...m, open: false})); } }} className="bg-white p-8 md:p-12 rounded-[2rem] md:rounded-[2.5rem] w-full max-w-md shadow-2xl relative">
                                <button type="button" onClick={() => setLoginModal(m => ({...m, open: false}))} className="absolute top-6 right-6 text-slate-400"><Icons.X /></button>
                                <h3 className="text-xl md:text-2xl font-black text-center mb-6 md:mb-8 uppercase">Acesso Gestão</h3>
                                <div className="space-y-4">
                                    <input type="text" placeholder="Username" className="w-full bg-slate-50 p-4 md:p-6 rounded-2xl font-bold border-2 border-transparent focus:border-indigo-500 outline-none" value={loginModal.user} onChange={e => setLoginModal({...loginModal, user: e.target.value})} />
                                    <input type="password" placeholder="Password" className="w-full bg-slate-50 p-4 md:p-6 rounded-2xl font-bold border-2 border-transparent focus:border-indigo-500 outline-none" value={loginModal.pass} onChange={e => setLoginModal({...loginModal, pass: e.target.value})} />
                                    <button className="w-full py-4 md:py-6 bg-indigo-600 text-white font-black uppercase rounded-2xl shadow-xl">Login</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {pointModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-white p-8 md:p-12 rounded-[2rem] md:rounded-[2.5rem] w-full max-w-md shadow-2xl relative">
                                <button onClick={() => setPointModal(null)} className="absolute top-6 right-6 text-slate-400"><Icons.X /></button>
                                <h3 className="text-xl md:text-2xl font-black mb-6 md:mb-8 uppercase text-indigo-600">{pointModal.id ? 'Edit Station' : 'Add Station'}</h3>
                                <div className="space-y-6">
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Station Label</label>
                                        <input autoFocus type="text" placeholder="e.g. Laser Loading" className="w-full bg-slate-50 p-4 md:p-6 rounded-2xl font-bold text-lg md:text-xl outline-none" value={pointModal.name} onChange={e => setPointModal({...pointModal, name: e.target.value})} />
                                    </div>
                                    <div className="flex gap-4">
                                        <button onClick={() => togglePoint(pointModal)} className="flex-1 py-4 md:py-6 bg-indigo-600 text-white font-black uppercase rounded-2xl shadow-xl">Save</button>
                                        {pointModal.id && <button onClick={() => removePoint(pointModal.id)} className="px-6 md:px-8 py-4 md:py-6 bg-red-50 text-red-500 rounded-2xl hover:bg-red-100 transition-all"><Icons.Trash /></button>}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

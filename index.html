        function App() {

            const [view, setView] = useState('splash');

            const [user, setUser] = useState(null);

            const [isAdmin, setIsAdmin] = useState(false);

            const [adminMode, setAdminMode] = useState('dashboard'); // dashboard | map_edit

            const [showLoginModal, setShowLoginModal] = useState(false);

            const [points, setPoints] = useState([]);

            const [historyLogs, setHistoryLogs] = useState([]);

            const [pendingEvaluations, setPendingEvaluations] = useState({});

            const [loginForm, setLoginForm] = useState({ user: '', pass: '' });

            const [activeEval, setActiveEval] = useState(null);

            const [isSubmitting, setIsSubmitting] = useState(false);

            const [isReady, setIsReady] = useState(false);

            const [showSuccessPulse, setShowSuccessPulse] = useState(false);            const [showLayoutGif, setShowLayoutGif] = useState(false);

            const [gifFadingOut, setGifFadingOut] = useState(false);

            const [isLandscape, setIsLandscape] = useState(window.innerWidth > window.innerHeight);            

            // Edit Point States

            const [showPointModal, setShowPointModal] = useState(null);

            const [editPointName, setEditPointName] = useState("");

            const mapContainerRef = useRef(null);



            useEffect(() => {

                const checkReady = setInterval(() => { if (window.FB) { setIsReady(true); clearInterval(checkReady); } }, 50);

                return () => clearInterval(checkReady);

            }, []);



            useEffect(() => {

                const handleOrientationChange = () => {

                    setIsLandscape(window.innerWidth > window.innerHeight);

                };

                window.addEventListener('orientationchange', handleOrientationChange);

                window.addEventListener('resize', handleOrientationChange);

                return () => {

                    window.removeEventListener('orientationchange', handleOrientationChange);

                    window.removeEventListener('resize', handleOrientationChange);

                };

            }, []);



            useEffect(() => {

                if (!isReady) return;

                const { auth, initialToken, methods } = window.FB;

                const initAuth = async () => {

                    try { if (initialToken) await methods.signInWithCustomToken(auth, initialToken); else await methods.signInAnonymously(auth); } catch (e) {}

                };

                initAuth();

                const unsubscribe = methods.onAuthStateChanged(auth, setUser);

                return () => unsubscribe();

            }, [isReady]);



            useEffect(() => {

                if (!isReady || !user) return;

                const { db, appId, methods } = window.FB;

                const pointsRef = methods.collection(db, 'artifacts', appId, 'public', 'data', 'config_points');

                const logsRef = methods.collection(db, 'artifacts', appId, 'public', 'data', 'history_logs');



                const unsubPoints = methods.onSnapshot(pointsRef, (snap) => {

                    setPoints(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));

                });

                const unsubLogs = methods.onSnapshot(logsRef, (snap) => {

                    setHistoryLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));

                });

                return () => { unsubPoints(); unsubLogs(); };

            }, [isReady, user]);



            const startNewRound = () => {

                setPendingEvaluations({});

                // Show loading GIF on mobile

                if (window.innerWidth < 768) {

                    setShowLayoutGif(true);

                    setGifFadingOut(false);

                    // Let GIF animate and pause for 3.5s, then fade out for 1.5s

                    setTimeout(() => {

                        setGifFadingOut(true);

                    }, 3500);

                    setTimeout(() => {

                        setShowLayoutGif(false);

                        setView('app');

                    }, 5000);

                } else {

                    setView('app');

                }

            };



            // Inactivity timer for app view - return to splash after 30s

            useEffect(() => {

                if (view !== 'app') return;

                

                let inactivityTimer;

                const resetTimer = () => {

                    clearTimeout(inactivityTimer);

                    inactivityTimer = setTimeout(() => {

                        setView('splash');

                        setPendingEvaluations({});

                    }, 30000); // 30 seconds

                };



                // Reset timer on user activity

                const events = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart', 'touchmove', 'click'];

                events.forEach(event => document.addEventListener(event, resetTimer));

                resetTimer(); // Start the initial timer



                return () => {

                    clearTimeout(inactivityTimer);

                    events.forEach(event => document.removeEventListener(event, resetTimer));

                };

            }, [view]);



            const currentStatusMap = useMemo(() => {

                const status = {};

                const sortedLogs = [...historyLogs].sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));

                sortedLogs.forEach(log => { status[log.pointId] = log.status; });

                return status;

            }, [historyLogs]);



            const stats = useMemo(() => {

                const s = {};

                points.forEach(p => s[p.id] = { name: p.name, score: 0, count: 0 });

                historyLogs.forEach(log => { if (s[log.pointId]) { s[log.pointId].score += log.score; s[log.pointId].count++; } });

                const list = Object.values(s).filter(x => x.count > 0).map(st => ({ ...st, performance: (st.score / (st.count * 3)) * 100 }));

                const totalScore = list.reduce((a, b) => a + b.score, 0);

                const totalPotential = list.reduce((a, b) => a + (b.count * 3), 0);

                return { list: list.sort((a,b) => b.performance - a.performance), avg: totalPotential > 0 ? ((totalScore / totalPotential) * 100).toFixed(1) : "0", total: list.reduce((a, b) => a + b.count, 0) };

            }, [points, historyLogs]);



            const getPerformanceColor = (performance) => {

                if (performance < 50) return { bg: 'bg-red-600', text: 'text-red-600', bar: 'bg-red-500' };

                if (performance < 60) return { bg: 'bg-yellow-500', text: 'text-yellow-600', bar: 'bg-yellow-500' };

                return { bg: 'bg-green-600', text: 'text-green-600', bar: 'bg-green-600' };

            };



            const submitAll = async () => {

                if (!user || isSubmitting) return;

                setIsSubmitting(true);

                const { db, appId, methods } = window.FB;

                const batch = methods.writeBatch(db);

                const logsRef = methods.collection(db, 'artifacts', appId, 'public', 'data', 'history_logs');

                try {

                    for (const [id, status] of Object.entries(pendingEvaluations)) {

                        const newLogRef = methods.doc(logsRef);

                        batch.set(newLogRef, { pointId: id, status, score: POINT_VALUES[status], timestamp: methods.serverTimestamp() });

                    }

                    await batch.commit();

                    setPendingEvaluations({});

                    setShowSuccessPulse(true);

                    setTimeout(() => setShowSuccessPulse(false), 1500);

                } catch (e) {

                    console.error(e);

                } finally {

                    setIsSubmitting(false);

                }

            };



            const handleMapClick = (e) => {

                if (!isAdmin || adminMode !== 'map_edit') return;

                const rect = mapContainerRef.current.getBoundingClientRect();

                const x = ((e.clientX - rect.left) / rect.width) * 100;

                const y = ((e.clientY - rect.top) / rect.height) * 100;

                setEditPointName("");

                setShowPointModal({ x, y });

            };



            const savePoint = async () => {

                if (!editPointName || !isReady || !window.FB) {

                    console.warn('Save point conditions not met:', { editPointName, isReady, hasFB: !!window.FB });

                    return;

                }

                try {

                    const { db, appId, methods } = window.FB;

                    if (!db || !appId || !methods) {

                        console.error('Firebase not properly initialized', window.FB);

                        return;

                    }

                    const pointsRef = methods.collection(db, 'artifacts', appId, 'public', 'data', 'config_points');

                    if (showPointModal.id) {

                        const docRef = methods.doc(db, 'artifacts', appId, 'public', 'data', 'config_points', showPointModal.id);

                        await methods.updateDoc(docRef, { name: editPointName });

                    } else {

                        await methods.addDoc(pointsRef, { name: editPointName, x: showPointModal.x, y: showPointModal.y });

                    }

                    setShowPointModal(null);

                    setEditPointName("");

                } catch (e) {

                    console.error('Error saving point:', e);

                    alert('Failed to save station: ' + e.message);

                }

            };



            const deletePoint = async () => {

                if (!showPointModal?.id || !window.FB) return;

                try {

                    const { db, appId, methods } = window.FB;

                    const docRef = methods.doc(db, 'artifacts', appId, 'public', 'data', 'config_points', showPointModal.id);

                    await methods.deleteDoc(docRef);

                    setShowPointModal(null);

                } catch (e) {

                    console.error('Error deleting point:', e);

                    alert('Failed to delete station: ' + e.message);

                }

            };



            if (view === 'splash') {

                return (

                    <div className={`relative min-h-screen overflow-hidden ${isLandscape && window.innerWidth < 768 ? 'overflow-y-auto' : ''}`}>

                        {/* Loading GIF overlay on mobile */}

                        {showLayoutGif && (

                            <div className="fixed inset-0 z-[300] flex items-center justify-center bg-white pointer-events-none animate-in fade-in duration-300">

                                <img

                                    src="https://static.wixstatic.com/media/a6967f_9142290f38c8426c98c49711bd0b7974~mv2.gif"

                                    alt="Loading"

                                    className={gifFadingOut ? "w-4/5 h-4/5 object-contain gif-fade-out" : "w-4/5 h-4/5 object-contain gif-no-loop"}

                                />

                            </div>

                        )}

                        <div onClick={startNewRound} className="min-h-screen bg-white flex flex-col items-center justify-center cursor-pointer relative overflow-hidden">

                            <div className="absolute top-4 md:top-8 left-1/2 transform -translate-x-1/2 md:left-8 md:transform-none z-10 w-[90%] md:w-auto"><img src={CORNER_LOGO} className="w-full md:w-[286px] h-auto" /></div>

                        <div className="flex-1 flex items-center justify-center w-full relative -translate-y-[5%]">

                            <img src={SPLASH_IMAGE} className="max-w-[85%] md:max-w-full max-h-[80vh] object-contain drop-shadow-2xl rounded-[3rem]" />

                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none animate-heartbeat">

                                <Icons.GradientHeart size={120} />

                            </div>

                        </div>

                        </div>

                    </div>

                );

            }



            return (

                <div className={`min-h-screen flex flex-col bg-white font-sans text-slate-900 select-none ${isLandscape && window.innerWidth < 932 ? 'h-auto overflow-y-auto' : 'h-screen md:overflow-hidden'} overflow-y-auto`}>

                    {/* NAVBAR */}

                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 md:px-8 h-20 md:h-[77px] flex items-center justify-between shadow-sm">

                        <div className="flex items-center gap-1 md:gap-1">

                            <div className={`${isAdmin ? 'bg-amber-500 p-2.5 md:p-3.5' : 'bg-transparent p-0'} rounded-2xl text-white overflow-hidden flex items-center justify-center`}>

                                {isAdmin ? <Icons.Map /> : <img src={ROUND_ICON} className="w-12 h-12 md:w-14 md:h-14 object-contain" alt="Pulse Icon" />}

                            </div>

                            <div>

                                <h1 className="font-black uppercase tracking-tighter text-lg md:text-xl leading-none">

                                    {isAdmin ? 'Analysis Management' : 'FACTORY VISIT'}

                                </h1>

                                <p className="text-[10px] md:text-xs text-slate-400 font-bold uppercase tracking-[0.2em] mt-1">

                                    {isAdmin ? 'Configuration and Monitoring' : 'PULSE'}

                                </p>

                            </div>

                        </div>

                        <div className="flex-1 hidden md:flex justify-center">
                            <img src="https://static.wixstatic.com/media/a6967f_eee0d017524f4a48bf2870cc2385c10b~mv2.png" alt="Factory Logo" className="h-11 md:h-14 w-auto object-contain" />
                        </div>

                        <div className="flex items-center gap-3">

                            {isAdmin && (

                                <button

                                    onClick={() => setAdminMode(adminMode === 'dashboard' ? 'map_edit' : 'dashboard')}

                                    className={`px-4 py-3 rounded-xl font-bold text-xs uppercase flex items-center gap-2 transition-all ${adminMode === 'map_edit' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}

                                >

                                    <Icons.Settings />

                                    {adminMode === 'map_edit' ? 'View Dashboard' : 'Setup Map'}

                                </button>

                            )}

                            <button

                                onClick={() => isAdmin ? setIsAdmin(false) : setShowLoginModal(true)}

                                className="px-4 md:px-8 py-3 md:py-4 rounded-xl md:rounded-2xl font-black text-xs md:text-sm uppercase border-2 border-slate-100 hover:border-indigo-600 transition-all"

                            >

                                {isAdmin ? 'Exit' : 'Management'}

                            </button>

                        </div>

                    </nav>



                    {/* MAIN */}

                    <main className="flex-1 overflow-y-auto relative bg-slate-50/30">

                        <div className="max-w-[1400px] mx-auto p-4 md:p-6 md:pb-10 h-full md:flex md:flex-col">

                            

                            {isAdmin && adminMode === 'dashboard' ? (

                                <div className="space-y-10 animate-in fade-in duration-500">

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

                                        <div className={`${getPerformanceColor(parseFloat(stats.avg)).bg} text-white p-8 md:p-10 rounded-[2.5rem] md:rounded-[3.5rem] shadow-xl relative overflow-hidden`}>

                                            <p className="font-black uppercase text-[10px] tracking-widest mb-2 opacity-70">Global Performance Ratio</p>

                                            <h4 className="text-5xl md:text-7xl font-black">{stats.avg}%</h4>

                                        </div>

                                        <div className="bg-white border-2 border-slate-100 p-8 md:p-10 rounded-[2.5rem] md:rounded-[3.5rem] flex items-center gap-6 shadow-sm">

                                            <div className="bg-slate-50 p-4 rounded-3xl text-indigo-600"><Icons.Stats /></div>

                                            <div><p className="text-slate-400 font-black text-[10px] mb-1">TOTAL INSPECTIONS</p><h4 className="text-3xl font-black">{stats.total}</h4></div>

                                        </div>

                                        <div className="bg-white border-2 border-slate-100 p-8 md:p-10 rounded-[2.5rem] md:rounded-[3.5rem] flex items-center gap-6 shadow-sm">

                                            <div className="bg-slate-50 p-4 rounded-3xl text-indigo-600"><Icons.Check /></div>

                                            <div><p className="text-slate-400 font-black text-[10px] mb-1">ACTIVE STATIONS</p><h4 className="text-3xl font-black">{points.length}</h4></div>

                                        </div>

                                    </div>

                                    

                                    <div className="bg-white border-2 border-slate-100 rounded-[3rem] p-6 md:p-10 shadow-sm">

                                        <h3 className="text-xl md:text-2xl font-black uppercase mb-10 px-4">Performance by Station</h3>

                                        <div className="space-y-4">

                                            {stats.list.map(s => {

                                                const colors = getPerformanceColor(s.performance);

                                                return (

                                                    <div key={s.name} className="bg-slate-50 p-6 rounded-3xl">

                                                        <div className="flex justify-between items-center mb-4">

                                                            <h5 className="text-lg font-black uppercase tracking-tight">{s.name}</h5>

                                                            <span className={`font-bold ${colors.text}`}>{s.performance.toFixed(1)}%</span>

                                                        </div>

                                                        <div className="h-4 w-full bg-slate-200 rounded-full overflow-hidden">

                                                            <div className={`h-full rounded-full transition-all duration-1000 ${colors.bar}`} style={{ width: `${s.performance}%` }} />

                                                        </div>

                                                    </div>

                                                );

                                            })}

                                        </div>

                                    </div>

                                </div>

                            ) : (

                                <div className="space-y-6">

                                    {isAdmin && adminMode === 'map_edit' && (

                                        <div className="bg-amber-100 text-amber-800 p-4 rounded-2xl font-bold text-sm flex items-center gap-3 animate-pulse">

                                            <Icons.Settings /> Edit Mode: Click on map to add or station to edit/remove.

                                        </div>

                                    )}

                                    <div className="flex justify-center mb-6 md:hidden">
                                        <img src="https://static.wixstatic.com/media/a6967f_eee0d017524f4a48bf2870cc2385c10b~mv2.png" alt="Factory Logo" className="max-w-[80%] h-auto object-contain" />
                                    </div>

                                    <div

                                        ref={mapContainerRef}

                                        onClick={handleMapClick}

                                        className={`glass-container animate-in zoom-in-95 w-full md:w-full lg:h-[calc(100vh-180px)] md:flex md:items-center md:justify-center md:p-12 ${isAdmin && adminMode === 'map_edit' ? 'cursor-crosshair' : ''}`}

                                    >

                                        <FactoryLayout />

                                        {points.map(pt => {

                                            const pendingStatus = pendingEvaluations[pt.id];

                                            const displayStatus = (isAdmin && adminMode === 'dashboard') ? currentStatusMap[pt.id] : pendingStatus;

                                            const isPending = !!pendingStatus;

                                            

                                            return (

                                                <div key={pt.id} className="absolute transform -translate-x-1/2 -translate-y-1/2 z-10" style={{ top: `${pt.y}%`, left: `${pt.x}%` }}>

                                                    <button

                                                        onClick={(e) => {

                                                            e.stopPropagation();

                                                            if (isAdmin && adminMode === 'map_edit') {

                                                                setEditPointName(pt.name);

                                                                setShowPointModal(pt);

                                                            } else {

                                                                setActiveEval(pt);

                                                            }

                                                        }}

                                                        className={`group flex flex-col items-center gap-2 transition-all duration-300 ${isPending ? 'scale-110' : 'active:scale-90'}`}

                                                    >

                                                        <div className={`button-group-border p-1 md:p-1.5 flex items-center gap-1 shadow-2xl transition-all ${isPending ? 'ring-4 ring-indigo-400 ring-offset-2' : 'opacity-100 group-hover:opacity-100'}`}>

                                                            <SmileyFace type="sad" className={`w-5 h-5 md:w-8 md:h-8 rounded-full transition-all ${displayStatus === 'sad' ? 'bg-red-500 text-white' : 'text-white'}`} />

                                                            <SmileyFace type="neutral" className={`w-5 h-5 md:w-8 md:h-8 rounded-full transition-all ${displayStatus === 'neutral' ? 'bg-yellow-500 text-white' : 'text-white'}`} />

                                                            <SmileyFace type="happy" className={`w-5 h-5 md:w-8 md:h-8 rounded-full transition-all ${displayStatus === 'happy' ? 'bg-green-500 text-white' : 'text-white'}`} />

                                                        </div>

                                                        <div className={`label-gradient text-[8px] md:text-[10px] font-black px-2 md:px-3 py-1 md:py-1.5 uppercase tracking-widest shadow-xl transition-all ${isPending ? 'opacity-100' : 'opacity-100'}`} style={{ color: '#000000' }}>

                                                            {pt.name}

                                                        </div>

                                                    </button>

                                                </div>

                                            );

                                        })}

                                    </div>

                                </div>

                            )}

                        </div>

                    </main>



                    {/* SEND BUTTON */}

                    {!isAdmin && Object.keys(pendingEvaluations).length > 0 && (

                        <div className="fixed bottom-10 right-6 md:right-10 z-[100] animate-in slide-in-from-bottom-10">

                            <button onClick={submitAll} disabled={isSubmitting} className="group relative w-20 h-20 md:w-28 md:h-28 bg-indigo-600 text-white rounded-full shadow-[0_20px_50px_rgba(79,70,229,0.5)] flex flex-col items-center justify-center hover:bg-indigo-700 hover:scale-110 transition-all border-4 border-white">

                                {isSubmitting ? (

                                    <div className="w-8 h-8 border-4 border-white border-t-transparent rounded-full animate-spin"></div>

                                ) : (

                                    <>

                                        <Icons.Send />

                                        <span className="text-[10px] font-black uppercase mt-1">Send</span>

                                    </>

                                )}

                                <div className="absolute -top-2 -right-2 w-10 h-10 bg-red-500 text-white text-lg font-black rounded-full border-4 border-white flex items-center justify-center shadow-lg">

                                    {Object.keys(pendingEvaluations).length}

                                </div>

                            </button>

                        </div>

                    )}



                    {/* SUCCESS PULSE OVERLAY */}

                    {showSuccessPulse && (

                        <div className="fixed inset-0 z-[500] flex items-center justify-center pointer-events-none">

                            <div className="animate-success-pulse">

                                <Icons.GradientHeart size={250} />

                            </div>

                        </div>

                    )}



                    {/* EVALUATION MODAL */}

                    {activeEval && (

                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-950/90 backdrop-blur-xl p-2 md:p-4 animate-in fade-in duration-300">

                            <div className="bg-white rounded-2xl md:rounded-[3rem] p-4 md:p-16 w-full max-w-sm md:max-w-5xl shadow-2xl flex flex-col items-center max-h-[95vh] overflow-y-auto">

                                <header className="mb-4 md:mb-10 text-center">

                                    <h3 className="text-xl md:text-7xl font-black text-slate-900 mb-1 md:mb-4 uppercase tracking-tighter leading-none">{activeEval.name}</h3>

                                    <p className="text-slate-400 font-medium text-xs md:text-2xl uppercase">WHAT IS THE STATUS OF THIS STATION?</p>

                                </header>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-1 md:gap-8 mb-4 md:mb-10 w-full max-w-4xl">

                                    <button onClick={() => { setPendingEvaluations({...pendingEvaluations, [activeEval.id]: 'sad'}); setActiveEval(null); }} className="group flex flex-row md:flex-col items-center gap-2 md:gap-6 p-2 md:p-10 rounded-2xl md:rounded-3xl bg-white border-2 md:border-4 border-transparent hover:border-red-500 hover:bg-red-50 transition-all active:scale-95 shadow-xl">

                                        <SmileyFace type="sad" className="w-10 h-10 md:w-40 md:h-40 text-red-500 flex-shrink-0" />

                                        <span className="font-black text-xs md:text-2xl uppercase text-red-600">CRITICAL</span>

                                    </button>

                                    <button onClick={() => { setPendingEvaluations({...pendingEvaluations, [activeEval.id]: 'neutral'}); setActiveEval(null); }} className="group flex flex-row md:flex-col items-center gap-2 md:gap-6 p-2 md:p-10 rounded-2xl md:rounded-3xl bg-white border-2 md:border-4 border-transparent hover:border-yellow-500 hover:bg-yellow-50 transition-all active:scale-95 shadow-xl">

                                        <SmileyFace type="neutral" className="w-10 h-10 md:w-40 md:h-40 text-yellow-500 flex-shrink-0" />

                                        <span className="font-black text-xs md:text-xl uppercase text-yellow-600 text-center">ACCEPTABLE</span>

                                    </button>

                                    <button onClick={() => { setPendingEvaluations({...pendingEvaluations, [activeEval.id]: 'happy'}); setActiveEval(null); }} className="group flex flex-row md:flex-col items-center gap-2 md:gap-6 p-2 md:p-10 rounded-2xl md:rounded-3xl bg-white border-2 md:border-4 border-transparent hover:border-green-500 hover:bg-green-50 transition-all active:scale-95 shadow-xl">

                                        <SmileyFace type="happy" className="w-10 h-10 md:w-40 md:h-40 text-green-500 flex-shrink-0" />

                                        <span className="font-black text-xs md:text-2xl uppercase text-green-600">EXCELLENT</span>

                                    </button>

                                </div>

                                <button onClick={() => setActiveEval(null)} className="py-2 md:py-6 px-6 md:px-12 bg-slate-100 text-slate-500 rounded-xl md:rounded-2xl font-black uppercase text-xs md:text-xl hover:bg-slate-200 transition-all flex-shrink-0">CANCEL</button>

                            </div>

                        </div>

                    )}



                    {/* ADMIN EDIT POINT MODAL */}

                    {showPointModal && (

                        <div className="fixed inset-0 z-[300] flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-6 animate-in zoom-in-95">

                            <div className="bg-white rounded-[3rem] p-10 w-full max-w-lg shadow-2xl relative">

                                <button onClick={() => setShowPointModal(null)} className="absolute top-8 right-8 text-slate-400 hover:text-slate-600"><Icons.X /></button>

                                <h3 className="text-2xl font-black mb-8 uppercase text-indigo-600">{showPointModal.id ? 'Edit Station' : 'New Station'}</h3>

                                <div className="space-y-6">

                                    <div className="space-y-2">

                                        <label className="text-xs font-black text-slate-400 uppercase tracking-widest">Station Name</label>

                                        <input autoFocus type="text" placeholder="e.g. Laser Stock" className="w-full bg-slate-50 p-6 rounded-2xl text-xl font-bold border-4 border-transparent focus:border-indigo-500 outline-none" value={editPointName} onChange={e => setEditPointName(e.target.value)} />

                                    </div>

                                    <div className="flex gap-4">

                                        <button onClick={savePoint} className="flex-1 bg-indigo-600 text-white font-black py-6 rounded-2xl text-lg uppercase shadow-xl hover:bg-indigo-700 transition-all">Save</button>

                                        {showPointModal.id && (

                                            <button onClick={deletePoint} className="bg-red-50 p-6 rounded-2xl text-red-500 hover:bg-red-100 transition-all" title="Delete"><Icons.Trash /></button>

                                        )}

                                    </div>

                                </div>

                            </div>

                        </div>

                    )}



                    {/* MANAGEMENT LOGIN */}

                    {showLoginModal && (

                        <div className="fixed inset-0 z-[300] flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-6">

                            <div className="bg-white rounded-[2.5rem] p-10 md:p-16 w-full max-w-xl shadow-2xl relative">

                                <button onClick={() => setShowLoginModal(false)} className="absolute top-8 right-8 text-slate-400"><Icons.X /></button>

                                <h3 className="text-3xl font-black mb-10 uppercase text-center">Management Access</h3>

                                <form onSubmit={async (e) => {
                                        e.preventDefault();
                                        const { auth, methods } = window.FB;
                                        
                                        try {
                                            await methods.signInWithEmailAndPassword(auth, loginForm.user, loginForm.pass);
                                            setIsAdmin(true);
                                            setShowLoginModal(false);
                                        } catch (error) {
                                            console.error("Erro de acesso:", error.code);
                                            alert("Acesso Negado: Utilizador ou Password de Gestão incorretos.");
                                        }
                                    }} className="space-y-6">

                                    <input type="text" placeholder="Username" className="w-full bg-slate-50 p-6 rounded-2xl text-xl font-bold outline-none border-4 border-transparent focus:border-indigo-500 shadow-inner" onChange={e => setLoginForm({...loginForm, user: e.target.value})} />

                                    <input type="password" placeholder="Password" className="w-full bg-slate-50 p-6 rounded-2xl text-xl font-bold outline-none border-4 border-transparent focus:border-indigo-500 shadow-inner" onChange={e => setLoginForm({...loginForm, pass: e.target.value})} />

                                    <button type="submit" className="w-full bg-indigo-600 text-white font-black py-6 rounded-2xl text-lg uppercase shadow-xl hover:bg-indigo-700 transition-all">Login</button>

                                </form>

                            </div>

                        </div>

                    )}

                </div>

            );

        }



        const root = ReactDOM.createRoot(document.getElementById('root'));

        root.render(<App />);

    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registado!'))
            .catch(err => console.log('Erro ao registar SW:', err));
        });
      }
    </script>

<script>
    let deferredPrompt;
    const installBtn = document.getElementById('pwa-install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            installBtn.classList.add('hidden');
        }
    });

    window.addEventListener('appinstalled', () => {
        installBtn.classList.add('hidden');
    });
</script>
    
<script>
const offlineStatus = document.getElementById('offline-status');

function updateOnlineStatus() {
    if (navigator.onLine) {
        offlineStatus.classList.add('hidden');
    } else {
        offlineStatus.classList.remove('hidden');
    }
}

window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();
</script>

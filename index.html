<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção Postos Fábrica</title>
    
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM para a lógica da interface -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Firebase SDK (Versão Compat para facilitar o acesso global no CodePen) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <!-- Lucide Icons para os ícones da interface -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Fallback para garantir que o root ocupa o ecrã inteiro */
        #root {
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-white">
    <!-- Ponto de montagem da aplicação React -->
    <div id="root"></div>

</html>

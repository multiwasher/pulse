<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://static.wixstatic.com/media/a6967f_874354ad69c5461eafd229ab23540233~mv2.png">
    <title>Factory Station Maintenance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, onSnapshot, addDoc, deleteDoc, writeBatch, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        const firebaseConfig = { apiKey: "AIzaSyDX_fcMzzOXTaBh2VszUh-j_kmApR0fiv8", authDomain: "manutencao-fabrica.firebaseapp.com", projectId: "manutencao-fabrica", storageBucket: "manutencao-fabrica.firebasestorage.app", messagingSenderId: "322227932590", appId: "1:322227932590:web:2459b650fb9ca7c3b14c3f" };
        const app = initializeApp(firebaseConfig);
        window.FB = { auth: getAuth(app), db: getFirestore(app), appId: "manutencao-fabrica", methods: { doc, setDoc, getDoc, collection, query, onSnapshot, addDoc, deleteDoc, writeBatch, serverTimestamp, signInWithCustomToken, signInAnonymously, signInWithEmailAndPassword, onAuthStateChanged, updateDoc } };
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #ffffff; scroll-padding-top: 80px; }
        @media (max-width: 932px) {
            body, #root { overflow-x: hidden; overflow-y: auto !important; height: auto !important; min-height: 100vh; }
        }
        @media (min-width: 933px) {
            body, #root { overflow: hidden; width: 100vw; height: 100vh; }
        }
        .label-gradient { background: linear-gradient(90deg, rgb(81, 184, 234) 0%, rgb(27, 71, 148) 100%); }
        .button-group-border { background: linear-gradient(#000, #000) padding-box, linear-gradient(90deg, rgb(81, 184, 234) 0%, rgb(27, 71, 148) 100%) border-box; border: 2px solid transparent; border-radius: 9999px; }
        @keyframes heartbeat { 0%, 100%, 28%, 56%, 85% { transform: scale(1); opacity: 0.6; } 14%, 42% { transform: scale(1.15); opacity: 1; } }
        .animate-heartbeat { animation: heartbeat 2.5s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const LAYOUT_IMAGE = "https://static.wixstatic.com/media/a6967f_aac24f82eec442c8992856c104e39d20~mv2.png/v1/fill/w_1200,h_800,al_c,q_85/layout.webp";
        const SPLASH_IMAGE = "https://static.wixstatic.com/media/a6967f_1a75ce18a54d46f8994283c1798fbbfb~mv2.png/v1/fill/w_600,h_600,al_c,q_85/splash.webp";
        const CORNER_LOGO = "https://static.wixstatic.com/media/a6967f_eee0d017524f4a48bf2870cc2385c10b~mv2.png/v1/fill/w_420,h_120,al_c,q_85/logo.webp";
        const ROUND_ICON  = "https://static.wixstatic.com/media/a6967f_874354ad69c5461eafd229ab23540233~mv2.png/v1/fill/w_150,h_150,al_c,q_85/icon.webp";

        const SmileyFace = ({ type, className = "" }) => (
            <svg viewBox="0 0 100 100" className={className} fill="none">
                <circle cx="50" cy="50" r="45" stroke="currentColor" strokeWidth="8"/>
                <circle cx="33" cy="40" r="6" fill="currentColor"/><circle cx="67" cy="40" r="6" fill="currentColor"/>
                {type==='happy' && <path d="M30 65C35 72 42 75 50 75C58 75 65 72 70 65" stroke="currentColor" strokeWidth="8" strokeLinecap="round"/>}
                {type==='neutral' && <path d="M30 65H70" stroke="currentColor" strokeWidth="8" strokeLinecap="round"/>}
                {type==='sad' && <path d="M30 75C35 68 42 65 50 65C58 65 65 68 70 75" stroke="currentColor" strokeWidth="8" strokeLinecap="round"/>}
            </svg>
        );

        function App() {
            const [view, setView] = useState('splash');
            const [isAdmin, setIsAdmin] = useState(false);
            const [points, setPoints] = useState([]);
            const [pendingEvaluations, setPendingEvaluations] = useState({});
            const [activeEval, setActiveEval] = useState(null);
            const [isLandscape, setIsLandscape] = useState(window.innerWidth > window.innerHeight);
            const mapContainerRef = useRef(null);

            useEffect(() => {
                const handleResize = () => setIsLandscape(window.innerWidth > window.innerHeight);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                const checkReady = setInterval(() => {
                    if (window.FB) {
                        const { auth, methods, db, appId } = window.FB;
                        methods.signInAnonymously(auth);
                        methods.onSnapshot(methods.collection(db, 'artifacts', appId, 'public', 'data', 'config_points'), (s) => setPoints(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                        clearInterval(checkReady);
                    }
                }, 100);
            }, []);

            if (view === 'splash') return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-white" onClick={() => setView('app')}>
                    <img src={CORNER_LOGO} className="absolute top-8 w-64" />
                    <img src={SPLASH_IMAGE} className="max-w-[80%] max-h-[60vh] rounded-[3rem]" />
                    <div className="absolute animate-heartbeat"><svg width="100" height="100" viewBox="0 0 24 24"><path fill="rgba(81,184,234,0.8)" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></div>
                </div>
            );

            return (
                <div className={`flex flex-col bg-white font-sans text-slate-900 ${isLandscape ? 'min-h-screen' : 'h-screen'}`}>
                    {/* NAVBAR FIXA */}
                    <nav className="fixed top-0 left-0 w-full h-20 bg-white border-b border-slate-200 z-[100] px-4 md:px-8 flex items-center justify-between shadow-sm">
                        <div className="flex items-center gap-3">
                            <img src={ROUND_ICON} className="w-10 h-10" />
                            <h1 className="font-black uppercase text-lg tracking-tighter">Factory Visit</h1>
                        </div>
                        <button onClick={() => setIsAdmin(true)} className="px-4 py-2 border-2 rounded-xl text-xs font-black uppercase">Admin</button>
                    </nav>

                    {/* CONTEÚDO COM PADDING PARA NÃO FICAR SOB O HEADER */}
                    <main className="flex-1 overflow-y-auto pt-24 pb-10 px-4 md:px-8 bg-slate-50/30">
                        <div className="max-w-[1400px] mx-auto">
                            <div 
                                ref={mapContainerRef} 
                                className="relative bg-white rounded-[2rem] shadow-2xl border-[10px] border-white w-full h-auto min-h-[600px] md:h-[80vh] flex items-center justify-center overflow-hidden"
                            >
                                <img src={LAYOUT_IMAGE} className="w-full h-full object-contain pointer-events-none" />
                                {points.map(pt => (
                                    <div key={pt.id} className="absolute -translate-x-1/2 -translate-y-1/2" style={{ top: `${pt.y}%`, left: `${pt.x}%` }}>
                                        <button onClick={() => setActiveEval(pt)} className="flex flex-col items-center gap-1">
                                            <div className="button-group-border p-1 flex gap-1 bg-black/10">
                                                <SmileyFace type="sad" className={`w-6 h-6 ${pendingEvaluations[pt.id] === 'sad' ? 'bg-red-500 text-white rounded-full' : 'text-white/30'}`} />
                                                <SmileyFace type="neutral" className={`w-6 h-6 ${pendingEvaluations[pt.id] === 'neutral' ? 'bg-yellow-500 text-white rounded-full' : 'text-white/30'}`} />
                                                <SmileyFace type="happy" className={`w-6 h-6 ${pendingEvaluations[pt.id] === 'happy' ? 'bg-green-500 text-white rounded-full' : 'text-white/30'}`} />
                                            </div>
                                            <div className="label-gradient text-white text-[8px] font-black px-2 py-0.5 rounded uppercase">{pt.name}</div>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>

                    {/* MODAL DE AVALIAÇÃO */}
                    {activeEval && (
                        <div className="fixed inset-0 z-[200] bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-white rounded-[3rem] p-8 w-full max-w-2xl text-center">
                                <h2 className="text-3xl font-black mb-6 uppercase">{activeEval.name}</h2>
                                <div className="grid grid-cols-3 gap-4 mb-8">
                                    {['sad', 'neutral', 'happy'].map(t => (
                                        <button key={t} onClick={() => { setPendingEvaluations({...pendingEvaluations, [activeEval.id]: t}); setActiveEval(null); }} className="p-4 bg-slate-50 rounded-2xl border-2 border-transparent hover:border-indigo-500">
                                            <SmileyFace type={t} className={`w-16 h-16 mx-auto ${t==='sad'?'text-red-500':t==='neutral'?'text-yellow-500':'text-green-500'}`} />
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => setActiveEval(null)} className="font-bold text-slate-400 uppercase">Fechar</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
